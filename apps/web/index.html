<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#061329"/>
  <title>ASTRIX11 · Explore space</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"/>
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"/>
  <link rel="manifest" href="/site.webmanifest"/>
  <link rel="stylesheet" href="/src/startup.css"/>
</head>
<body>
  <div id="root">
    <main class="startup-screen" aria-busy="true" aria-labelledby="startup-title">
      <section class="startup-card">
        <div class="startup-brand">
          <img class="startup-logo" src="/assets/logo.png" alt="" width="512" height="426"/>
          <h1 id="startup-title" class="startup-title">ASTRIX11</h1>
        </div>
        <p class="startup-message" id="startup-status" role="status"><span lang="en">Preparing the application…</span><span lang="pt-BR">Preparando o aplicativo…</span></p>
        <progress class="startup-progress" aria-labelledby="startup-status"></progress>
        <div class="startup-actions" id="startup-recovery" hidden>
          <button type="button" id="startup-reload">Reload / Recarregar</button>
          <a href="./docs/INDEX.md">Documentation / Documentação</a>
        </div>
      </section>
    </main>
  </div>
  <noscript><div class="startup-noscript">JavaScript is required to run the simulator. / O simulador precisa de JavaScript. <a href="./docs/INDEX.md">Read the documentation / Ler a documentação</a></div></noscript>
  <script type="module">
    import('/src/main.tsx').catch(error => {
      console.error('ASTRIX11 bootstrap failed', error);
      const startup = document.querySelector('.startup-screen');
      if (!startup) return;
      startup.classList.add('startup-failed');
      startup.setAttribute('aria-busy', 'false');
      const status = document.getElementById('startup-status');
      status.setAttribute('role', 'alert');
      status.querySelector('[lang="en"]').textContent = 'The application could not start. Reload to try again.';
      status.querySelector('[lang="pt-BR"]').textContent = 'O aplicativo não pôde iniciar. Recarregue para tentar novamente.';
      document.getElementById('startup-reload').addEventListener('click', () => location.reload());
      document.getElementById('startup-recovery').hidden = false;
    });
  </script>
</body>
</html>
